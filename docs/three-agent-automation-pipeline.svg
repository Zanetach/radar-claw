<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FBFF"/>
      <stop offset="50%" stop-color="#EEF6FF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1E3A8A" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 54px; font-weight: 850; fill: #0F172A; letter-spacing: 0; }
      .subtitle { font-size: 23px; fill: #475569; letter-spacing: 0; }
      .section { font-size: 28px; font-weight: 850; fill: #0F172A; letter-spacing: 0; }
      .body { font-size: 20px; fill: #334155; letter-spacing: 0; }
      .small { font-size: 16px; fill: #64748B; letter-spacing: 0; }
      .mini { font-size: 14px; fill: #64748B; letter-spacing: 0; }
      .card { fill: #FFFFFF; stroke: #D7E3F4; stroke-width: 1.2; }
      .step { font-size: 20px; font-weight: 800; fill: #0F172A; letter-spacing: 0; }
      .stepMuted { font-size: 16px; fill: #64748B; letter-spacing: 0; }
      .white { fill: #FFFFFF; }
      .line { stroke: #2563EB; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #0F766E; stroke-width: 5; fill: none; marker-end: url(#arrowGreen); stroke-dasharray: 10 9; }
    </style>
  </defs>

  <rect width="1800" height="1125" rx="34" fill="url(#bg)"/>
  <path d="M1230 0 C1422 108 1530 222 1800 260 L1800 0 Z" fill="#DBEAFE" opacity="0.74"/>
  <path d="M0 960 C260 890 455 1030 705 945 C940 865 1110 1030 1385 930 C1560 868 1665 986 1800 920 L1800 1125 L0 1125 Z" fill="#CCFBF1" opacity="0.32"/>

  <g class="font">
    <g transform="translate(80 64)">
      <rect x="0" y="0" width="78" height="78" rx="22" fill="url(#blue)" filter="url(#softShadow)"/>
      <text x="39" y="51" text-anchor="middle" font-size="38" font-weight="900" fill="#FFFFFF">R</text>
    </g>
    <text x="180" y="104" class="title">三 Agent 协同自动化流水线</text>
    <text x="183" y="143" class="subtitle">内容采集 → 内容整理 → 矩阵发布：从外部内容到 10 个矩阵账号发布与数据回流</text>

    <rect x="1308" y="72" width="415" height="54" rx="27" fill="#FFFFFF" stroke="#BFDBFE" filter="url(#softShadow)"/>
    <text x="1360" y="106" class="body" font-weight="800">目标：自动采集、自动整理、自动分发</text>

    <rect x="76" y="198" width="1648" height="678" rx="34" class="card" filter="url(#shadow)"/>
    <text x="118" y="250" class="section">流水线主链路</text>
    <text x="118" y="286" class="body">三个 AI Agent 各自负责一个阶段，通过标准数据产物交接，形成可追踪、可重试、可回流的自动化闭环。</text>

    <g transform="translate(118 334)">
      <rect x="0" y="0" width="430" height="500" rx="30" fill="#FFFFFF" stroke="#BFDBFE" filter="url(#softShadow)"/>
      <rect x="0" y="0" width="430" height="88" rx="30" fill="url(#blue)"/>
      <text x="34" y="54" font-size="28" font-weight="900" fill="#FFFFFF">内容采集 Agent</text>
      <text x="34" y="118" class="small">把外部平台内容变成可入库的 raw content</text>

      <g transform="translate(34 150)">
        <rect x="0" y="0" width="362" height="42" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="22" y="28" class="step">抓取</text>
        <text x="112" y="28" class="stepMuted">账号、关键词、URL、Excel 批量</text>

        <rect x="0" y="58" width="362" height="42" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="22" y="86" class="step">URL 去重</text>
        <text x="142" y="86" class="stepMuted">同链接只保留一份</text>

        <rect x="0" y="116" width="362" height="42" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="22" y="144" class="step">语义去重</text>
        <text x="142" y="144" class="stepMuted">相似内容合并归一</text>

        <rect x="0" y="174" width="362" height="42" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="22" y="202" class="step">热度评分</text>
        <text x="142" y="202" class="stepMuted">互动、时效、账号权重</text>

        <rect x="0" y="232" width="362" height="42" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="22" y="260" class="step">合规过滤</text>
        <text x="142" y="260" class="stepMuted">风险词、来源、版权边界</text>
      </g>

      <rect x="26" y="440" width="378" height="42" rx="14" fill="#0F172A"/>
      <text x="215" y="467" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">输出：raw content</text>

      <line x1="462" y1="213" x2="552" y2="213" class="line"/>
      <rect x="486" y="168" width="82" height="42" rx="21" fill="#FFFFFF" stroke="#BFDBFE" filter="url(#softShadow)"/>
      <text x="527" y="195" text-anchor="middle" class="mini" font-weight="800">raw</text>

      <rect x="580" y="0" width="430" height="500" rx="30" fill="#FFFFFF" stroke="#C7D2FE" filter="url(#softShadow)"/>
      <rect x="580" y="0" width="430" height="88" rx="30" fill="url(#purple)"/>
      <text x="614" y="54" font-size="28" font-weight="900" fill="#FFFFFF">内容整理 Agent</text>
      <text x="614" y="118" class="small">把 raw content 整理为可发布的 classified content</text>

      <g transform="translate(614 150)">
        <rect x="0" y="0" width="362" height="42" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
        <text x="22" y="28" class="step">清洗</text>
        <text x="112" y="28" class="stepMuted">去噪、补齐字段、规范格式</text>

        <rect x="0" y="58" width="362" height="42" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
        <text x="22" y="86" class="step">翻译</text>
        <text x="112" y="86" class="stepMuted">保留原文，生成中文版本</text>

        <rect x="0" y="116" width="362" height="42" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
        <text x="22" y="144" class="step">LLM 分类</text>
        <text x="142" y="144" class="stepMuted">按 8 类内容体系归档</text>

        <rect x="0" y="174" width="362" height="42" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
        <text x="22" y="202" class="step">标签 / 摘要</text>
        <text x="152" y="202" class="stepMuted">提炼主题、观点和亮点</text>

        <rect x="0" y="232" width="362" height="42" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
        <text x="22" y="260" class="step">账号匹配</text>
        <text x="142" y="260" class="stepMuted">匹配矩阵账号和发布口径</text>
      </g>

      <rect x="606" y="440" width="378" height="42" rx="14" fill="#312E81"/>
      <text x="795" y="467" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">输出：classified content</text>

      <line x1="1042" y1="213" x2="1132" y2="213" class="line"/>
      <rect x="1058" y="168" width="112" height="42" rx="21" fill="#FFFFFF" stroke="#C7D2FE" filter="url(#softShadow)"/>
      <text x="1114" y="195" text-anchor="middle" class="mini" font-weight="800">classified</text>

      <rect x="1160" y="0" width="430" height="500" rx="30" fill="#FFFFFF" stroke="#A7F3D0" filter="url(#softShadow)"/>
      <rect x="1160" y="0" width="430" height="88" rx="30" fill="url(#green)"/>
      <text x="1194" y="54" font-size="28" font-weight="900" fill="#FFFFFF">矩阵发布 Agent</text>
      <text x="1194" y="118" class="small">把 classified content 分发到矩阵账号并回收数据</text>

      <g transform="translate(1194 150)">
        <rect x="0" y="0" width="362" height="42" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="22" y="28" class="step">排期</text>
        <text x="112" y="28" class="stepMuted">选择发布时间和账号队列</text>

        <rect x="0" y="58" width="362" height="42" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="22" y="86" class="step">发布</text>
        <text x="112" y="86" class="stepMuted">分发到目标平台和账号</text>

        <rect x="0" y="116" width="362" height="42" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="22" y="144" class="step">数据回流</text>
        <text x="142" y="144" class="stepMuted">阅读、互动、转化表现</text>

        <rect x="0" y="174" width="362" height="42" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="22" y="202" class="step">异常重试</text>
        <text x="142" y="202" class="stepMuted">失败原因记录和重发</text>

        <rect x="0" y="232" width="362" height="42" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="22" y="260" class="step">10 个矩阵账号发布</text>
      </g>

      <rect x="1186" y="440" width="378" height="42" rx="14" fill="#064E3B"/>
      <text x="1375" y="467" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">输出：发布结果与回流数据</text>
    </g>

    <rect x="76" y="914" width="1648" height="92" rx="28" fill="#FFFFFF" stroke="#D7E3F4" filter="url(#shadow)"/>
    <g transform="translate(118 934)">
      <rect x="0" y="0" width="290" height="52" rx="18" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="145" y="33" text-anchor="middle" class="body" font-weight="800">采集层：保证来源可信和去重</text>
      <line x1="315" y1="26" x2="415" y2="26" class="line"/>
      <rect x="438" y="0" width="290" height="52" rx="18" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text x="583" y="33" text-anchor="middle" class="body" font-weight="800">整理层：保证内容可发布</text>
      <line x1="753" y1="26" x2="853" y2="26" class="line"/>
      <rect x="876" y="0" width="290" height="52" rx="18" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="1021" y="33" text-anchor="middle" class="body" font-weight="800">发布层：保证分发和回流</text>
      <path d="M1192 26 C1300 86 1440 86 1530 26" class="loop"/>
      <text x="1380" y="35" text-anchor="middle" class="body" font-weight="800" fill="#0F766E">回流数据反哺下一轮采集和评分</text>
    </g>

    <rect x="76" y="1032" width="1648" height="62" rx="24" fill="#0F172A" filter="url(#softShadow)"/>
    <text x="118" y="1070" font-size="20" font-weight="800" fill="#FFFFFF">一句话说明：</text>
    <text x="250" y="1070" font-size="20" fill="#D7EAFE">采集 Agent 负责找到好内容，整理 Agent 负责把内容变成可发布资产，发布 Agent 负责排期分发并把数据反馈回来。</text>
  </g>
</svg>
